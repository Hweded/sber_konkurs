frequency: MS
date_column: date
value_column: value
entity_columns: [municipality, category]
hierarchy_columns: [region, cluster]
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  audit: reports/artifacts/missingness_audit.parquet
  quality_log: reports/artifacts/quality_filter_log.json
quality:
  critical_missing_fraction: 0.40
  action: exclude
  periodic_run_fraction: 0.20
imputation:
  short_gap: 2
  medium_gap: 6
  methods: [pchip_causal, stl_causal, hierarchical_seasonal]
  seasonal_period: 12
  min_history_for_seasonality: 4
  seasonal_decay: 0.92
  outlier_z_threshold: 8.0
  winsorize_outliers: true
  # Explicit shocks are retained and are never winsorized or interpolated away.
  structural_shock_dates: [2020-03, 2020-04, 2022-03, 2022-10]
external:
  frequency: MS
  macro_sources: [rosstat_cpi, cbr_key_rate]
  news_decay: 0.85
  news_columns: [news_sentiment, news_shock]
  causal_lags: [1, 2]
validation:
  mask_fraction: 0.05
  random_state: 42
  metrics: [MAE, WAPE, variance_ratio, acf_mean_abs_error, ADF_pvalue_before, ADF_pvalue_after]
